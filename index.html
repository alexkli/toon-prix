<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toon Prix</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Toon Prix">
<meta name="theme-color" content="#3d9bff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="tilt-top" class="tilt"></div><div id="tilt-bottom" class="tilt"></div>

<div id="hud" class="hidden">
  <div id="tower"></div>
  <div id="topmid">
    <div id="lapbox"><span id="lap">LAP 1/3</span><span id="clock">0:00.00</span></div>
    <div id="lights"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="topright">
    <div id="btns">
      <button id="b-reset" class="rb" title="Back on track (R)">↺</button>
      <button id="b-auto" class="rb" title="Autopilot (T)">🤖</button>
      <button id="b-cam" class="rb" title="Camera (C)">🎥</button>
      <button id="b-pause" class="rb" title="Pause (P)">⏸</button>
    </div>
    <canvas id="minimap" width="220" height="220"></canvas>
  </div>
  <div id="dash">
    <div id="posbig">P1</div>
    <div id="speedo"><b id="speed">0</b><small>km/h</small>
      <div id="boostbar"><i id="boostfill"></i></div>
    </div>
  </div>
  <div id="focusname"></div>
  <div id="touch" class="hidden">
    <div class="tl"><button data-k="left">◀</button><button data-k="right">▶</button></div>
    <div class="tr"><button data-k="boost" class="tb-boost">⚡</button><button data-k="brake" class="tb-brake">BRAKE</button><button data-k="gas" class="tb-gas">GAS</button></div>
  </div>
</div>
<div id="banner"></div>
<div id="toast"></div>
<div id="screen"></div>
<div id="spotify" class="hidden"><button id="sp-tab">🎵 Spotify <span>▾</span></button><div id="sp-body"><div id="sp-embed"></div></div></div>
<div id="confetti"></div>
<div id="loading"><div class="logo"><span>TOON</span><span>PRIX</span></div><p>Warming up the tyres…</p></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
